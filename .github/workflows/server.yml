name: server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: affected
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="${{ github.event.before }}...HEAD"
          fi
          if ! files="$(git diff --name-only --no-renames "$range")"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files" | python .github/scripts/ci_affected.py ${{ github.workflow }}

  lint:
    name: server / lint
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Fail when change detection did not succeed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run lint --prefix server

  typecheck:
    name: server / typecheck
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Fail when change detection did not succeed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run typecheck --prefix server

  test:
    name: server / test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Fail when change detection did not succeed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server/tests -v

  deploy:
    needs: [changes, lint, typecheck, test]
    if: needs.changes.outputs.affected == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --prefix server
      - name: Publish
        env:
          GOALIE_DEPLOY_HOST: ${{ secrets.GOALIE_DEPLOY_HOST }}
          GOALIE_DEPLOY_USER: ${{ secrets.GOALIE_DEPLOY_USER }}
          GOALIE_DEPLOY_SSH_KEY: ${{ secrets.GOALIE_DEPLOY_SSH_KEY }}
          GOALIE_INSTALLER: /usr/local/sbin/excaliwire-goalie-install
        run: bash .github/scripts/deploy_server.sh
