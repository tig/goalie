name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff and mypy
        run: python -m pip install ruff==0.16.9 mypy==2.3.1
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: |
          if [ -d goalie ]; then
            python -m mypy goalie
          else
            echo "goalie/ does not exist. Skipping mypy."
          fi
      - name: Test
        run: python -m unittest discover -s tests -v
