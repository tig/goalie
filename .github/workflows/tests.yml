name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: affected
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="${{ github.event.before }}...HEAD"
          fi
          if ! files="$(git diff --name-only "$range")"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files" | python .github/scripts/ci_affected.py ${{ github.workflow }}

  test:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
