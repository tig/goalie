name: tests

on:
  pull_request:
    paths:
      - "tests/**"
      - "SPEC.md"
      - "USERS_MANUAL.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/server.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/guidance.yml"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "SPEC.md"
      - "USERS_MANUAL.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/server.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/guidance.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
