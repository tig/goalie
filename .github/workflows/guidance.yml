name: guidance

# Regenerates the agent form from guidance/agents.md with the Cursor CLI when
# the full text or the prompt changes, and commits it to the pull request
# branch. On a push to main or develop it only checks. The paid file is AGENTS.md at the repo root.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every agent form, even if its inputs did not change"
        type: boolean
        default: false

concurrency:
  group: agent-forms-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: affected
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="${{ github.event.before }}...HEAD"
          fi
          if ! files="$(git diff --name-only --no-renames "$range")"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files" | python .github/scripts/ci_affected.py ${{ github.workflow }}

  test:
    name: guidance / test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Fail when change detection did not succeed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s guidance/tests -v

  generate:
    # Fork pull requests get no secrets and no write token.
    needs: changes
    if: needs.changes.outputs.affected == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Regenerate stale agent forms
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Set the AGENT_FORMS_MODEL repository variable to pin a Cursor model.
          AGENT_FORMS_MODEL: ${{ vars.AGENT_FORMS_MODEL }}
        run: python .github/scripts/agent_forms.py generate ${{ inputs.force && '--force' || '' }}
      - name: Commit regenerated agent forms
        run: |
          git add guidance/ AGENTS.md
          if git diff --cached --quiet; then
            echo "Agent forms are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate agent forms"
          git push
      - run: python .github/scripts/agent_forms.py check

  check:
    needs: changes
    if: needs.changes.outputs.affected == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/agent_forms.py check
